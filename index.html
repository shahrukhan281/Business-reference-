<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BusinessConnect – Refer customers. Earn commission.</title>
<style>
:root{--blue:#1565c0;--blue-d:#0d47a1;--blue-l:#e3f0ff;--green:#1b9e5a;--green-d:#13794a;--green-l:#e4f7ec;--ink:#16222e;--muted:#5f6f7f;--line:#e3e9ef;--bg:#f4f7fb;--card:#fff;--soft:#eef3f8;--warn:#9a5b00;--warn-l:#fff4e0;--red:#c62828;--shadow:0 4px 16px rgba(20,60,100,.08);color-scheme:light}
[data-theme=dark]{--blue:#5aa5f7;--blue-d:#3b8ae0;--blue-l:#17304f;--green:#2fc57a;--green-d:#47d98f;--green-l:#133a2a;--ink:#e8eef5;--muted:#9fb0c1;--line:#26364a;--bg:#0d1621;--card:#152130;--soft:#1b2a3a;--warn:#f0b04a;--warn-l:#3a2d12;--red:#ff7b7b;--shadow:0 4px 16px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--blue);text-decoration:none}
h1{font-size:1.6rem;line-height:1.2;margin:.3em 0}
h2{font-size:1.25rem;margin:0 0 .5em}
h3{font-size:1.08rem;margin:0}
p{margin:.4em 0}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:8px;height:56px}
.logo{font-weight:800;font-size:1.3rem;color:var(--blue);margin-right:auto}.logo b{color:var(--green)}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:var(--soft);font-size:1.15rem;cursor:pointer;color:var(--ink)}
#sp{display:none;padding:0 0 10px}#sp.on{display:block}
.demo{background:var(--ink);color:var(--bg);text-align:center;font-size:.78rem;padding:5px 10px}

/* inputs & buttons */
input,select,textarea{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
label{display:block;font-weight:700;font-size:.95rem;margin:14px 0 5px}
label small{font-weight:400;color:var(--muted)}
.btn{display:inline-block;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer;text-align:center}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--green)}.btn.o{background:transparent;color:var(--blue);border:2px solid var(--blue)}.btn.r{background:var(--red)}
.btn.s{padding:9px 14px;font-size:.92rem}.btn.big{display:block;width:100%;font-size:1.1rem;padding:16px}
.btn[disabled]{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:16px}
.chip{display:inline-block;background:var(--blue-l);color:var(--blue);font-weight:700;font-size:.8rem;padding:4px 11px;border-radius:99px}
.chip.g{background:var(--green-l);color:var(--green-d)}.chip.w{background:var(--warn-l);color:var(--warn)}
.note{background:var(--warn-l);color:var(--ink);border-left:5px solid var(--warn);border-radius:10px;padding:11px 13px;font-size:.93rem;margin:14px 0}
.err{color:var(--red);font-weight:600;min-height:1.3em;margin:8px 0 0}

/* home */
.hero{background:linear-gradient(135deg,#1565c0,#0f7f8f 55%,#1b9e5a);color:#fff;border-radius:24px;padding:24px 18px;margin:14px 0;text-align:center}
.hero h1{font-size:1.75rem}.hero p{opacity:.95}
.hero .two{display:grid;gap:10px;margin-top:16px}
.hero .btn{font-size:1.05rem;padding:16px}.hero .w{background:#fff;color:var(--blue-d)}.hero .t{background:rgba(255,255,255,.16);border:2px solid #fff}
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:9px 15px;color:var(--ink);font-weight:600;font-size:.95rem;white-space:nowrap}
.chips a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.head h2{margin:0}

/* business cards */
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.hero .two{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.biz{overflow:hidden}
.pic{display:block;height:150px;position:relative;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.earn{position:absolute;left:10px;bottom:10px;background:var(--green);color:#fff;font-weight:800;padding:6px 12px;border-radius:99px;font-size:.92rem;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.biz .b{padding:13px 14px 14px}
.biz .sub{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.btns{display:flex;gap:8px;align-items:center}
.btns .btn{flex:1;padding:11px 6px;font-size:.95rem}
.heart{flex:none;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer;color:var(--red)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}.empty b{display:block;font-size:1.1rem;color:var(--ink)}

/* detail */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{height:210px;border-radius:16px;scroll-snap-align:start;max-width:88vw;object-fit:cover}
.money{background:var(--green-l);border:2px solid var(--green);border-radius:18px;padding:16px;text-align:center;margin:14px 0}
.money small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.money b{display:block;font-size:1.7rem;color:var(--green-d)}
.rowbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

/* referrals */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0}
.seg a{text-align:center;padding:11px 6px;border-radius:11px;font-weight:700;color:var(--muted)}.seg a.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.prog{display:flex;gap:4px;margin:10px 0 4px}.prog i{flex:1;height:8px;border-radius:5px;background:var(--line)}.prog i.on{background:var(--green)}
.proglab{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-weight:600}
.rc{padding:14px;margin-bottom:12px}

/* account */
.list a,.list button{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.list a:last-child,.list button:last-child{border-bottom:0}
.list .ic{font-size:1.4rem;width:34px;text-align:center}.list .go{margin-left:auto;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px}.stat b{display:block;font-size:1.5rem;color:var(--blue)}.stat span{font-size:.78rem;color:var(--muted)}

/* tab bar */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60;box-shadow:0 -4px 16px rgba(20,60,100,.08)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;color:var(--muted);font-size:.69rem;font-weight:700;white-space:nowrap}
nav a i{font-style:normal;font-size:1.45rem;line-height:1.1}nav a.on{color:var(--blue)}
@media(min-width:900px){body{padding-bottom:20px}}

/* modal + toast */
.mw{position:fixed;inset:0;background:rgba(8,20,32,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.m{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));position:relative}
@media(min-width:640px){.mw{align-items:center}.m{border-radius:24px}}
.x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:2rem;color:var(--muted);cursor:pointer}
#toast{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:200;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.25s;font-weight:600;max-width:90vw}
#toast.on span{opacity:1;transform:none}
.code{font-size:1.7rem;font-weight:800;letter-spacing:2px;text-align:center;background:var(--green-l);color:var(--green-d);border-radius:14px;padding:12px;margin:10px 0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.95rem}.check input{width:22px;height:22px;flex:none;margin-top:2px}
.pre{flex:none;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:700}
.spin{width:36px;height:36px;border:4px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;margin:40px auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* compact business card */
.biz{display:block}
.biz .top{display:flex;gap:12px;padding:12px 12px 0;align-items:center}
.biz .pic{flex:none;width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--soft)}
.biz .pic img{width:100%;height:100%;object-fit:cover}
.biz .inf{min-width:0;flex:1}
.biz .inf h3{font-size:1.05rem;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz .inf .sub{margin:0 0 6px;font-size:.84rem;line-height:1.35}
.biz .earn2{display:inline-block;background:var(--green-l);color:var(--green-d);font-weight:800;font-size:.82rem;padding:3px 10px;border-radius:99px;border:1px solid var(--green)}
.biz .btns{padding:12px}
.biz .btns .btn{padding:10px 14px;font-size:.95rem}

/* home like directory apps */
.hsearch{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;margin:14px 0 4px;box-shadow:var(--shadow)}
.hsearch input{border:0;padding:10px 4px;background:transparent;box-shadow:none}
.hsearch input:focus{box-shadow:none}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin:18px 0 8px}
.ct{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);text-align:center}
.ct .ci{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:color-mix(in srgb,hsl(var(--h) 85% 55%) 17%,var(--card))}
.ct .cn{font-size:.8rem;font-weight:600;line-height:1.2}
.cgrid .more{display:none}.cgrid.all .more{display:flex}
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--blue-l);border-radius:18px;padding:16px;margin:16px 0}
.promo h2{font-size:1.15rem;margin:0 0 2px;color:var(--ink)}
.promo .pb{display:flex;gap:8px}
.center{text-align:center}

/* clean look: one accent colour */
:root{--green:#1565c0;--green-d:#0d47a1;--green-l:#e8f0fb}
[data-theme=dark]{--green:#5aa5f7;--green-d:#8fc0fa;--green-l:#17304f}
.logo{color:var(--ink)}.logo b{color:var(--blue)}
.ct .ci{background:var(--soft)}
.promo{background:var(--soft)}
.btn.g{color:#fff}[data-theme=dark] .btn,[data-theme=dark] .btn.g{color:#0d1621}[data-theme=dark] .btn.o{color:var(--blue)}
.biz .earn2{background:transparent;border:0;padding:0;color:var(--ink);font-weight:700}
.nwl{display:flex;flex-direction:column}
.nw{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.nw b{display:block;font-size:.98rem;line-height:1.35;font-weight:600}
.nw span{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.svc{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border:0}

/* services, slider, news, ai */
nav a{font-size:.72rem}nav a i{font-size:1.45rem}
.slider{position:relative}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px;background:var(--soft)}
.sl::-webkit-scrollbar{display:none}
.sl img{flex:none;width:100%;height:230px;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--blue);width:18px;border-radius:6px}
.sv{padding:14px;margin-bottom:12px}
.svh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.svp{color:var(--ink);white-space:nowrap}
.sv .btns{display:flex;gap:8px;margin-top:10px}.sv .btns .btn{flex:1;padding:10px 12px;font-size:.92rem}
.art{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);align-items:center}
.art img{width:84px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.art b{display:block;font-size:1rem;line-height:1.3}.art span{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.artbody{font-size:1.02rem;line-height:1.65;margin-top:8px}
#fab{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:55}
[data-theme=dark] #fab{color:#0d1621}
.aichat{display:flex;flex-direction:column;gap:10px;padding:6px 0 90px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.bub.bot{background:var(--soft);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
[data-theme=dark] .bub.me{color:#0d1621}
.aiimg{display:block;width:100%;max-width:300px;border-radius:12px}
.aibar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);z-index:56;max-width:900px;margin:0 auto}
.aibar input{flex:1}
/* ---- v2 additions ---- */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.qa a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:.74rem;font-weight:700;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.qa a span{font-size:1.4rem}
.closed,.oh{font-size:.78rem;color:var(--muted);margin:2px 0}
.meta{font-size:.78rem;color:var(--muted)}
.stars{display:flex;gap:4px;margin:6px 0}.stars button{background:none;border:0;font-size:2rem;line-height:1;color:#c9d3dd;padding:0 2px;cursor:pointer}.stars button.on{color:#f5a623}
.stars-s{color:#f5a623;font-size:.9rem;white-space:nowrap}
.rv{border-top:1px solid var(--line);padding:8px 0}
.soc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.soc a{background:var(--soft);border-radius:20px;padding:5px 12px;font-size:.8rem;font-weight:700;color:var(--blue)}
.dayrow,.togs,.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.dchip{display:inline-flex;margin:0}.dchip input{display:none}
.dchip span{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer}
.dchip input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.chips2 span{background:var(--soft);border-radius:16px;padding:5px 10px;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.tg2{display:flex;gap:6px}
.fh{margin:16px 0 4px;font-size:.95rem;border-top:1px solid var(--line);padding-top:12px}
.promo2{background:var(--blue-l);border-color:#c5dcf6}
.chatfile{display:inline-block;margin-top:4px;text-decoration:underline;word-break:break-all}
.ctime{font-size:.65rem;opacity:.7;margin-top:2px}
.qrbox{display:flex;justify-content:center;margin:10px 0}.qrbox svg{width:230px;height:230px;background:#fff;padding:8px;border-radius:8px}
.itm{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;background:var(--soft)}
.itm .row{gap:6px;margin-bottom:6px}
.monthbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0}
.monthbar a{font-size:1.5rem;padding:0 10px;color:var(--blue);font-weight:700}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-top:8px}
.tr{text-align:right;white-space:nowrap}
.cbar{margin:8px 0}.bt{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:3px}.bt i{display:block;height:100%;background:var(--blue);border-radius:4px}
.locst{margin-left:6px}
.cvw[hidden]{display:none}
#btt{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:1.4rem;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:58;cursor:pointer}
#btt[hidden]{display:none}
/* invoice */
.inv{background:#fff;color:#111;border:1px solid #ddd;padding:16px;font-size:.82rem;line-height:1.4;border-radius:6px}
.ivh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:8px}
.ivh h2{margin:0 0 2px;font-size:1.1rem}.ivh p,.ivt p,.ivb p{margin:1px 0}
.ivt{text-align:right}.ivt h1{margin:0 0 2px;font-size:1.2rem;letter-spacing:1px}
.ivb{margin:8px 0}
.ivtb{width:100%;border-collapse:collapse;margin:8px 0}
.ivtb th,.ivtb td{border:1px solid #bbb;padding:4px 6px;text-align:left}.ivtb th{background:#eee}
.ivtb td:last-child,.ivtb th:last-child{text-align:right}
.ivsum{margin-left:auto;min-width:55%;border-collapse:collapse}.ivsum td{padding:3px 6px}.ivsum td:last-child{text-align:right}
.ivsum .gt td{border-top:2px solid #111;font-weight:800;font-size:.95rem}
.ivw{margin:8px 0}
.ivsg{display:flex;flex-direction:column;align-items:flex-end;margin-top:28px}.sgl{width:160px;border-bottom:1px solid #111;height:30px}
.inv{overflow-x:auto}
@media print{
 .x,header,nav,#btt,.toast,#toast,.noprint,.aibar{display:none!important}
 body:has(.mw) main{display:none!important}body{background:#fff}main{padding:0!important;margin:0!important;max-width:none!important}
 .mw{position:static!important;background:none!important;padding:0!important;display:block!important}
 .m{box-shadow:none!important;max-height:none!important;overflow:visible!important;border:0!important;width:auto!important;max-width:none!important}
 .inv{border:0}
}
</style>
<style>[hidden]{display:none!important}.btn.gbtn{background:#fff;color:#222;border:1.5px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px}.btn.gbtn:hover{background:#f6f8fb}</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar">

const PHOTO_HELP="Best size: 1200 × 900 px (4:3), JPG or PNG, up to 8 MB. You can crop it next. We shrink it for you.";
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("This file is not a picture."));im.src=u})}
function cropper(file,aspect0){
  return new Promise(async res=>{
    if(file.size>8*1024*1024){toast("This photo is bigger than 8 MB.");return res(null)}
    let im;try{im=await loadImg(file)}catch(e){toast(e.message);return res(null)}
    let done=false,asp=aspect0||4/3,z=1,ox=0,oy=0;
    const W=Math.min(320,innerWidth-70);
    const m=modal(`<h2>Crop photo</h2><p class="muted small">${PHOTO_HELP}</p>
      <div class="row" id="cr-asp" style="margin:8px 0">${[["1:1",1],["4:3",4/3],["16:9",16/9],["3:4",3/4]].map(([l,v])=>`<button type="button" class="btn o s" data-a="${v}">${l}</button>`).join("")}</div>
      <div style="display:flex;justify-content:center"><canvas id="cr-c" style="touch-action:none;border-radius:12px;background:#000;max-width:100%"></canvas></div>
      <label>Zoom</label><input type="range" id="cr-z" min="1" max="4" step="0.01" value="1">
      <div class="row" style="margin-top:12px"><button type="button" class="btn g" id="cr-ok">✔ Use photo</button><button type="button" class="btn o" id="cr-skip">Skip crop</button></div>`);
    const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(im.src);res(v)};
    const oc=m.close;m.close=()=>{oc.call(m);fin(null)};
    const cv=$("#cr-c",m),cx=cv.getContext("2d");
    const dims=()=>{cv.width=W;cv.height=Math.round(W/asp)};
    const cover=()=>Math.max(cv.width/im.width,cv.height/im.height);
    const clamp=()=>{const s=cover()*z,w=im.width*s,h=im.height*s;ox=Math.min(0,Math.max(cv.width-w,ox));oy=Math.min(0,Math.max(cv.height-h,oy))};
    const draw=()=>{clamp();cx.fillStyle="#000";cx.fillRect(0,0,cv.width,cv.height);const s=cover()*z;cx.drawImage(im,ox,oy,im.width*s,im.height*s)};
    const center=()=>{const s=cover()*z;ox=(cv.width-im.width*s)/2;oy=(cv.height-im.height*s)/2};
    const setAsp=a=>{asp=a;dims();center();draw();$$("#cr-asp [data-a]",m).forEach(b=>b.classList.toggle("g",Math.abs(+b.dataset.a-a)<0.01))};
    setAsp(asp);
    $$("#cr-asp [data-a]",m).forEach(b=>b.onclick=()=>{z=1;$("#cr-z",m).value=1;setAsp(+b.dataset.a)});
    $("#cr-z",m).oninput=e=>{const old=cover()*z,cxm=(cv.width/2-ox)/old,cym=(cv.height/2-oy)/old;z=+e.target.value;const s=cover()*z;ox=cv.width/2-cxm*s;oy=cv.height/2-cym*s;draw()};
    let drag=null;
    cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox,oy};cv.setPointerCapture(e.pointerId)};
    cv.onpointermove=e=>{if(!drag)return;const k=cv.width/cv.getBoundingClientRect().width;ox=drag.ox+(e.clientX-drag.x)*k;oy=drag.oy+(e.clientY-drag.y)*k;draw()};
    cv.onpointerup=cv.onpointercancel=()=>{drag=null};
    $("#cr-ok",m).onclick=()=>{
      const outW=Math.min(900,Math.round(cv.width*3)),k=outW/cv.width,o=document.createElement("canvas");o.width=outW;o.height=Math.round(cv.height*k);
      const s=cover()*z*k;o.getContext("2d").drawImage(im,ox*k,oy*k,im.width*s,im.height*s);
      const data=o.toDataURL("image/jpeg",.72);fin(data);oc.call(m);
    };
    $("#cr-skip",m).onclick=async()=>{try{fin(await shrink(file))}catch{fin(null)}oc.call(m)};
  });
}
// pick up to "max" photos, cropping each one
async function pickImages(files,max,aspect){
  const out=[];
  for(const f of [...files].slice(0,max||4)){const d=await cropper(f,aspect);if(d)out.push(d)}
  return out;
}
// small compress for chat pictures
function imgData(file,max,q){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};im.src=fr.result};fr.readAsDataURL(file)})}

const GSTRE=/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/;
function socialUrl(k,v){v=String(v||"").trim();if(!v)return"";if(k==="ig"&&/^@?[\w.]+$/.test(v))return "https://instagram.com/"+v.replace("@","");return normUrl(v)}
function readBiz(form){
  const f=new FormData(form),g=k=>String(f.get(k)||"").trim();
  if(!g("name"))return{error:"Please write the business name."};
  if(!g("cat"))return{error:"Please choose what is sold."};
  if(!g("owner"))return{error:"Please write the owner's name."};
  if(!/^[6-9]\d{9}$/.test(g("phone")))return{error:"Please write a correct 10-digit mobile number."};
  if(!g("city")||!g("area"))return{error:"Please write the city and area."};
  const ct=g("ct"),cv=+g("cv");
  if(ct!=="talk"&&!(cv>0))return{error:"Please write the commission amount."};
  if(ct==="percent"&&cv>100)return{error:"Percent cannot be more than 100."};
  const gst=g("gst").toUpperCase();if(gst&&!GSTRE.test(gst))return{error:"The GST number does not look right. It has 15 letters and numbers, or leave it empty."};
  const open=g("open"),close=g("close");if(!!open!==!!close)return{error:"Please fill both opening and closing time, or leave both empty."};
  const lat=parseFloat(g("lat")),lng=parseFloat(g("lng"));
  return{data:{name:g("name"),cat:g("cat"),owner:g("owner"),phone:g("phone"),city:g("city"),area:g("area"),ct,cv:ct==="talk"?0:cv,note:g("note"),desc:g("desc"),tags:g("tags"),svc:g("svc"),
    open,close,days:f.getAll("d").map(Number).sort(),gst,ig:socialUrl("ig",g("ig")),fb:socialUrl("fb",g("fb")),yt:socialUrl("yt",g("yt")),web:socialUrl("web",g("web")),lat:isNaN(lat)?null:lat,lng:isNaN(lng)?null:lng}};
}
function bindBizForm(form){
  const sync=()=>{const t=$(".ct",form).value;$(".cvw",form).hidden=t==="talk";$(".cvl",form).textContent=t==="percent"?"Percent (%) – example: 10":"Amount in ₹ – example: 500"};
  $(".ct",form).onchange=sync;sync();
  $(".locbtn",form).onclick=async()=>{const st=$(".locst",form);st.textContent="Finding…";try{const p=await getPos();form.elements.lat.value=p.lat.toFixed(6);form.elements.lng.value=p.lng.toFixed(6);st.textContent="✔ Location saved"}catch(e){st.textContent=e.message}};
}
async function photosFor(form,data){
  const files=[...form.elements.photo.files];
  if(files.length){const imgs=await pickImages(files,4,4/3);if(imgs.length){data.imgs=imgs;data.img=imgs[0]}}
  else if(form.elements.rmph&&form.elements.rmph.checked){data.imgs=[];data.img=""}
}

function bindEdit(form){
  bindBizForm(form);
  form.onsubmit=async e=>{
    e.preventDefault();
    const err=$("#ee"),fail=m=>{err.textContent=m;err.scrollIntoView({block:"center",behavior:"smooth"})};
    const r=readBiz(form);if(r.error)return fail(r.error);
    if(!form.elements.ok.checked)return fail("Please tick the box to agree.");
    const btn=form.querySelector(".big");btn.disabled=true;btn.textContent="Saving…";
    try{
      const data=r.data;await photosFor(form,data);
      const ex=await getBiz(U.uid);
      if(ex)await fb.updateDoc(dref("businesses",U.uid),{...data,upd:Date.now()});
      else await fb.setDoc(dref("businesses",U.uid),{img:"",...data,ownerUid:U.uid,status:"pending",featured:false,t:Date.now()});
      bust();toast(ex?"Saved":"Sent for approval!");location.hash="#/shop";

  };
}

function qrModal(items,title){
  const m=modal(`<h2>${esc(title||"QR code")}</h2><div class="row" id="qt">${items.map((it,i)=>`<button type="button" class="btn ${i?"o":"g"} s" data-i="${i}">${esc(it.label)}</button>`).join("")}</div>
    <div id="qb" class="qrbox"></div><p class="small muted" id="qu" style="word-break:break-all;text-align:center"></p>
    <div class="row noprint" style="justify-content:center"><button class="btn g s" id="qd">⬇ Download</button><button class="btn o s" id="qp">🖨 Print</button></div>`);
  let cur=0;
  const show=i=>{cur=i;$$("#qt [data-i]",m).forEach(b=>b.classList.toggle("g",+b.dataset.i===i));$$("#qt [data-i]",m).forEach(b=>b.classList.toggle("o",+b.dataset.i!==i));
    try{$("#qb",m).innerHTML=QR.svg(items[i].url,240)}catch(e){$("#qb",m).innerHTML=`<p class="err">${esc(e.message)}</p>`}$("#qu",m).textContent=items[i].url};
  $$("#qt [data-i]",m).forEach(b=>b.onclick=()=>show(+b.dataset.i));show(0);
  $("#qd",m).onclick=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=1024;c.getContext("2d").drawImage(im,0,0,1024,1024);c.toBlob(bl=>{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="qr-code.png";a.click()})};im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(QR.svg(items[cur].url,1024))};
  $("#qp",m).onclick=()=>window.print();
}

BIND.chat=()=>{
  stopChat();
  const box=$("#cmsgs");if(!box)return;
  const uid=box.dataset.uid,av=box.dataset.av==="1";let file=null,busy=false;
  const mark=async()=>{try{await fb.setDoc(dref("chats",uid),av?{unreadUser:false,unreadAdmin:false}:{unreadAdmin:false,unreadUser:false},{merge:true})}catch{}};
  const draw=snap=>{
    box.innerHTML="";
    snap.docs.forEach(d=>{
      const x=d.data(),mine=av?x.from==="admin":x.from==="user",b=document.createElement("div");b.className="bub "+(mine?"me":"bot");
      if(x.text){const t=document.createElement("div");t.textContent=x.text;b.appendChild(t)}
      if(x.file&&safeData(x.file.data)){
        if(/^data:image\//.test(x.file.data)){const im=document.createElement("img");im.className="aiimg";im.src=x.file.data;b.appendChild(im)}
        const a=document.createElement("a");a.href=x.file.data;a.download=String(x.file.name||"file").replace(/[^\w.\- ]/g,"_");a.textContent="⬇ "+String(x.file.name||"file").slice(0,40);a.className="chatfile";b.appendChild(a);
      }
      const tm=document.createElement("div");tm.className="ctime";tm.textContent=new Date(x.t||0).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});b.appendChild(tm);
      box.appendChild(b);
    });
    if(!snap.docs.length)box.innerHTML=`<div class="bub bot">${av?"No messages yet.":"Hello! 👋 How can we help you? You can also ask for a free poster for your business."}</div>`;
    window.scrollTo(0,document.body.scrollHeight);
  };
  CHATU=fb.onSnapshot(fb.query(col("chats/"+uid+"/msgs"),fb.orderBy("t")),s=>{draw(s);mark()},e=>{box.innerHTML=`<div class="bub bot">${esc(friendly(e))}</div>`});
  $("#cfile").onchange=async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    try{
      let data;
      if(/^image\//.test(f.type)){data=await imgData(f,1000,.7);if(data.length>FILE_MAX*1.35)data=await imgData(f,700,.55)}
      else{if(f.size>FILE_MAX)return toast("This file is bigger than 600 KB.");data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
      if(data.length>FILE_MAX*1.4)return toast("This file is too big.");
      file={name:f.name,type:f.type,data};$("#cfn").textContent="📎 "+f.name+" is ready. Tap Send."
    }catch{toast("Could not read this file.")}
  };
  $("#cf").onsubmit=async e=>{
    e.preventDefault();const t=$("#cin").value.trim();if((!t&&!file)||busy)return;busy=true;
    try{
      const now=Date.now(),msg={from:av?"admin":"user",text:t,t:now};if(file)msg.file=file;
      await fb.addDoc(col("chats/"+uid+"/msgs"),msg);
      const meta={last:t||("📎 "+file.name),t:now};if(av){meta.unreadUser=true}else{meta.unreadAdmin=true;meta.name=P.name}
      await fb.setDoc(dref("chats",uid),meta,{merge:true});
      $("#cin").value="";file=null;$("#cfn").textContent="";
    }catch(x){toast(friendly(x))}
    busy=false;
  };
};

let INV=null;
const NW1=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],NW2=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
const nw2=x=>x<20?NW1[x]:NW2[Math.floor(x/10)]+(x%10?" "+NW1[x%10]:"");
const nw3=x=>(x>99?NW1[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?nw2(x%100):"");
function inWords(n){
  n=Math.round(Math.abs(n));if(!n)return"Zero Rupees Only";
  const parts=[[1e7,"Crore"],[1e5,"Lakh"],[1e3,"Thousand"]];let s="";
  parts.forEach(([v,w])=>{const k=Math.floor(n/v);if(k){s+=nw3(k)+" "+w+" ";n%=v}});
  if(n)s+=nw3(n);
  return "Rupees "+s.trim()+" Only";
}
const blankInv=(type,seller,no)=>({type,no,date:ymd(new Date()),due:"",seller,buyer:{name:"",addr:"",phone:"",gstin:""},items:[{d:"",hsn:"",q:1,r:"",g:18}],
  opts:{gst:!!seller.gstin,hsn:false,disc:false,due:false,notes:true,bank:false,sign:false,intra:true},disc:{type:"pct",v:""},custom:[],notes:"Thank you for your business.",bank:"",signName:""});
function calc(v){
  const rs=v.items.map(i=>({amt:(+i.q||0)*(+i.r||0),g:v.opts.gst?(+i.g||0):0}));
  const sub=rs.reduce((s,x)=>s+x.amt,0);
  let disc=0;if(v.opts.disc){disc=v.disc.type==="pct"?sub*(+v.disc.v||0)/100:(+v.disc.v||0);disc=Math.min(Math.max(disc,0),sub)}
  const f=sub?(sub-disc)/sub:1,taxable=sub-disc,grp={};let tax=0;
  rs.forEach(x=>{if(x.g){const t=x.amt*f*x.g/100;tax+=t;grp[x.g]=(grp[x.g]||0)+t}});
  const raw=taxable+tax,total=Math.round(raw);
  return{rows:rs,sub,disc,taxable,tax,grp,raw,total,round:total-raw};
}

const loginPage=(why)=>`<div class="card pad" style="margin-top:16px;text-align:center"><h1>Login</h1>
  <p class="muted">${why||"Login with your Google account. It is free."}</p>
  <button class="btn big gbtn" id="gbtn">${GLOGO}<span>Continue with Google</span></button>

function bindLogin(){
  const b=$("#gbtn");if(!b)return;
  b.onclick=async()=>{
    const e1=$("#e1");e1.textContent="";b.disabled=true;
    try{await fb.signInWithPopup(auth,new fb.GoogleAuthProvider())}

      const c=(e&&e.code)||"";
      e1.textContent=(c.includes("popup-closed")||c.includes("cancelled-popup"))?"Login was cancelled. Please try again.":friendly(e);

const setupPage=()=>`<div class="card pad" style="margin-top:16px"><h1>Welcome! 👋</h1><p class="muted">Just three details and you are ready.</p>
  <form id="pf"><label>Your name</label><input name="name" maxlength="60" autocomplete="name" value="${esc((U&&U.displayName)||"")}">
  <label>Your city</label><input name="city" maxlength="40">
  <label>Your mobile number <small>(shops and workers use it to contact you)</small></label>
  <div class="row" style="flex-wrap:nowrap"><span class="pre">+91</span><input name="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10-digit number"></div>
  <p class="err" id="pe"></p><button class="btn g big">Start</button></form></div>`;
function bindSetup(){
  const f=$("#pf");if(!f)return;
  f.onsubmit=async e=>{
    e.preventDefault();const d=new FormData(f),name=String(d.get("name")).trim(),city=String(d.get("city")).trim(),phone=String(d.get("phone")).replace(/\D/g,""),er=$("#pe");
    if(name.length<2)return er.textContent="Please write your name.";
    if(city.length<2)return er.textContent="Please write your city.";
    if(!/^[6-9]\d{9}$/.test(phone))return er.textContent="Please write a correct 10-digit mobile number.";
    const btn=f.querySelector("button");btn.disabled=true;
    try{
      const data={name,city,phone,email:U.email||"",createdAt:Date.now()};
      await fb.setDoc(dref("users",U.uid),data);P=data;await loadExtras();toast("Welcome, "+name+"!");

// ============ router ============
const app=$("#app");
const GATED=new Set(["shop","edit","refs","me","saved","admin","money","bill","chat","chats"]);
let tok=0;
async function route(keep){
  if(!READY){app.innerHTML=spin();return}
  const my=++tok;stopChat();document.querySelectorAll(".mw").forEach(x=>x.remove());
  const parts=location.hash.replace(/^#\/?/,"").split("?"),segs=parts[0].split("/").filter(Boolean);
  const name=segs[0]||"home",id=segs[1],q=new URLSearchParams(parts[1]||"");
  const t=({home:"home",list:"home",biz:"home",jobs:"home",articles:"home",article:"home",services:"services",money:"money",bill:"bill"})[name]||"me";
  $$("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===t));

  $("#lg").hidden=!!U;
  const show=h=>{if(my!==tok)return false;app.innerHTML=h;if(!keep)window.scrollTo(0,0);return true};
  if(name==="login"){
    if(U&&P){const n=NEXT||"#/";NEXT=null;location.hash=n;return}
    if(!U){show(loginPage());bindLogin();return}
  }
  if(U&&!P){show(setupPage());bindSetup();return}
  if(GATED.has(name)&&!U){show(loginPage("Please login to use this. It only takes a minute."));bindLogin();return}
  if(!pages[name]){show(`<div class="empty"><b>Page not found</b><a class="btn" href="#/">Go home</a></div>`);return}
  if(!keep)app.innerHTML=spin();
  try{const html=await pages[name](q,id);if(show(html))bind(name)}
  catch(e){console.error(e);show(`<div class="empty"><b>⚠️ Could not load</b><p class="muted small">${esc(friendly(e))}</p><button class="btn" id="retry">Try again</button></div>`);const r=$("#retry");if(r)r.onclick=()=>route()}
}
window.addEventListener("hashchange",()=>route());

let SLT=null;
function bind(name){
  if(BIND[name])BIND[name]();
  clearInterval(SLT);
  const sl=$(".sl");
  if(sl&&sl.children.length>1){
    const n=sl.children.length,dots=$$(".dots i");let i=0;
    const mark=k=>dots.forEach((d,x)=>d.classList.toggle("on",x===k));
    sl.onscroll=()=>{i=Math.round(sl.scrollLeft/sl.clientWidth);mark(i)};
    SLT=setInterval(()=>{if(!document.body.contains(sl)){clearInterval(SLT);return}i=(i+1)%n;sl.scrollTo({left:i*sl.clientWidth,behavior:"smooth"})},3000);
  }

  const hs=$("#hs");if(hs)hs.onsubmit=e=>{e.preventDefault();const v=$("#hq").value.trim();location.hash="#/list"+(v?"?q="+encodeURIComponent(v):"")};
  const sf=$("#sf");if(sf)sf.onsubmit=e=>{e.preventDefault();const p=new URLSearchParams(location.hash.split("?")[1]||"");const v=new FormData(sf).get("q").trim();v?p.set("q",v):p.delete("q");location.hash="#/services?"+p};
  const lf=$("#lf");if(lf)lf.onsubmit=e=>{e.preventDefault();const p=new URLSearchParams(location.hash.split("?")[1]||"");const v=new FormData(lf).get("q").trim();v?p.set("q",v):p.delete("q");location.hash="#/list?"+p};
  const cf=$("#cityf");if(cf)cf.onchange=()=>{const p=new URLSearchParams(location.hash.split("?")[1]||"");cf.value?p.set("city",cf.value):p.delete("city");location.hash="#/list?"+p};
  const ef=$("#ef");if(ef)bindEdit(ef);
  const rn=$("#rename");if(rn)rn.onclick=async()=>{
    const n=prompt("Your name",P.name);if(n===null)return;
    const ph=prompt("Your mobile number (10 digits)",P.phone);if(ph===null)return;
    const nn=n.trim(),pp=ph.replace(/\D/g,"");
    if(nn.length<2||!/^[6-9]\d{9}$/.test(pp))return toast("Name or number is not correct");
    try{await fb.updateDoc(dref("users",U.uid),{name:nn,phone:pp});P.name=nn;P.phone=pp;toast("Saved");route(true)}catch(e){toast(friendly(e))}};
  const lo=$("#logout");if(lo)lo.onclick=async()=>{await fb.signOut(auth);toast("Logged out");location.hash="#/"};
  const ci=$("#copyid");if(ci)ci.onclick=e=>{e.preventDefault();(navigator.clipboard?navigator.clipboard.writeText(U.uid):Promise.reject()).then(()=>toast("ID copied"),()=>prompt("Copy your ID",U.uid))};
  const hd=$("#hide");if(hd)hd.onclick=async()=>{try{const b=await getBiz(U.uid);await fb.updateDoc(dref("businesses",U.uid),{status:b.status==="hidden"?"approved":"hidden"});bust();toast("Done");route(true)}catch(e){toast(friendly(e))}};
  const dl=$("#del");if(dl)dl.onclick=async()=>{if(!confirm("Delete your business?"))return;try{await fb.deleteDoc(dref("businesses",U.uid));bust();toast("Deleted");location.hash="#/shop"}catch(e){toast(friendly(e))}};
}

// ============ buttons ============
function needLogin(msg){NEXT=location.hash;toast(msg||"Please login first");location.hash="#/login"}
document.addEventListener("click",e=>{const x=e.target.closest("[data-x]");if(!x)return;e.preventDefault();const k=x.dataset.x.indexOf("|"),a=x.dataset.x.slice(0,k),arg=x.dataset.x.slice(k+1);const h=XH[a];if(h)Promise.resolve(h(arg)).catch(err=>{console.error(err);toast(friendly(err))})});
addEventListener("scroll",()=>{const b=$("#btt");if(b)b.hidden=scrollY<500},{passive:true});
$("#btt").onclick=()=>scrollTo({top:0,behavior:"smooth"});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=$$(".mw");if(m.length)m[m.length-1].remove()}});
document.addEventListener("click",async e=>{
  const s=e.target.closest("[data-save]");
  if(s){
    if(!U)return needLogin("Please login to save");
    const id=s.dataset.save,has=SAVED.has(id);
    try{
      has?await fb.deleteDoc(dref("users",U.uid,"saved",id)):await fb.setDoc(dref("users",U.uid,"saved",id),{t:Date.now()});
      has?SAVED.delete(id):SAVED.add(id);
      s.textContent=s.classList.contains("heart")?(has?"♡":"♥"):(has?"♡ Save":"♥ Saved");toast(has?"Removed":"Saved");
      if(location.hash.startsWith("#/saved"))route(true);
    }catch(x){toast(friendly(x))}
    return;
  }
  const r=e.target.closest("[data-refer]");
  if(r){if(!U)return needLogin("Please login to refer a customer");const b=await getBiz(r.dataset.refer);if(b)referral(b);return}
  const st=e.target.closest("[data-st]");
  if(st){const [id,v]=st.dataset.st.split("|");st.disabled=true;try{await fb.updateDoc(dref("referrals",id),{status:v,t2:Date.now()});toast("Updated");route(true)}catch(x){toast(friendly(x));st.disabled=false}return}
  const rp=e.target.closest("[data-report]");
  if(rp){if(!U)return needLogin("Please login to report");const b=await getBiz(rp.dataset.report),why=prompt("What is wrong with this business?");
    if(why&&why.trim()){try{await fb.addDoc(col("reports"),{bizId:b.id,name:b.name,why:why.trim().slice(0,400),by:U.uid,t:Date.now()});toast("Thank you. The admin will check.")}catch(x){toast(friendly(x))}}return}
  const ad=e.target.closest("[data-ad]");
  if(ad){const [a,id]=ad.dataset.ad.split("|");
    if(a==="add")return adminAdd();
    if(a==="bulk")return adminBulk();
    if(a==="art")return articleModal();
    try{
      if(a==="okjob"){await fb.updateDoc(dref("jobs",id),{status:"approved"});toast("Job is live");return route(true)}
      if(a==="deljob"){if(!confirm("Remove this job?"))return;await fb.deleteDoc(dref("jobs",id));toast("Done");return route(true)}
      if(a==="okart"){await fb.updateDoc(dref("articles",id),{status:"approved"});toast("Article is live");return route(true)}
      if(a==="delart"){if(!confirm("Remove this article?"))return;await fb.deleteDoc(dref("articles",id));toast("Done");return route(true)}
    }catch(x){return toast(friendly(x))}
    if(a==="edit"){const eb=await getBiz(id);return eb&&adminAdd(eb)}
    try{
      if(a==="rep")await fb.deleteDoc(dref("reports",id));
      if(a==="ok")await fb.updateDoc(dref("businesses",id),{status:"approved"});
      if(a==="star"){const b=await getBiz(id);await fb.updateDoc(dref("businesses",id),{featured:!b.featured})}
      if(a==="del"){if(!confirm("Remove this business?"))return;await fb.deleteDoc(dref("businesses",id))}
      bust();toast("Done");route(true);
    }catch(x){toast(friendly(x))}
  }
});

function adminBulk(){
  const cats=Object.keys(CATS);
  const m=modal(`<h2>Add many businesses</h2>
   <p class="muted small">One business per line. Separate with commas:<br><b>name, category, owner, mobile, city, area, commission</b></p>
   <p class="small" style="background:var(--soft);padding:8px;border-radius:10px">Example:<br>Sharma Sweets, Grocery, Raj Sharma, 9876543210, Pune, Pimpri, 10%<br>City Mobiles, Mobile Phones, Amit, 9123456780, Pune, Akurdi, 300<br>Raj Tutors, Education, Raj, 9012345678, Pune, Nigdi, talk</p>
   <p class="muted small">Commission: <b>10%</b> = percent, <b>300</b> = fixed ₹, <b>talk</b> = talk to owner. Wrong category becomes "Other Services".</p>
   <textarea id="bt" rows="8" placeholder="Paste your lines here"></textarea>
   <p class="err" id="be"></p><button class="btn g big" id="bg">Add all</button>`);
  $("#bg",m).onclick=async()=>{
    const er=$("#be",m),lines=$("#bt",m).value.split("\n").map(x=>x.trim()).filter(Boolean),out=[],bad=[];
    lines.forEach((ln,i)=>{
      const p=ln.split(",").map(x=>x.trim());
      if(p.length<7){bad.push(i+1);return}
      const [name,cat,owner,phone,city,area,com]=p,ph=phone.replace(/\D/g,"").slice(-10);
      let ct="talk",cv=0;
      if(/%$/.test(com)){ct="percent";cv=parseFloat(com)}else if(/^\d+(\.\d+)?$/.test(com)){ct="fixed";cv=parseFloat(com)}
      if(!name||!owner||!city||!area||!/^[6-9]\d{9}$/.test(ph)||(ct!=="talk"&&!(cv>0))||(ct==="percent"&&cv>100)){bad.push(i+1);return}
      const c=cats.find(k=>k.toLowerCase()===cat.toLowerCase())||"Other Services";
      out.push({name:name.slice(0,70),cat:c,owner:owner.slice(0,60),phone:ph,city:city.slice(0,40),area:area.slice(0,50),ct,cv,note:"",desc:"",img:"",ownerUid:"",status:"approved",featured:false,addedBy:U.uid,t:Date.now()});
    });
    if(!lines.length)return er.textContent="Please paste at least one line.";
    if(bad.length)return er.textContent="Please check line number: "+bad.join(", ")+". Nothing was added.";
    if(out.length>200)return er.textContent="Please add up to 200 at a time.";
    const btn=$("#bg",m);btn.disabled=true;btn.textContent="Adding…";
    try{
      const have=new Set(rows(await fb.getDocs(col("businesses"))).map(x=>x.phone+"|"+String(x.name).toLowerCase()));
      const fresh=out.filter(d=>{const k=d.phone+"|"+d.name.toLowerCase();if(have.has(k))return false;have.add(k);return true});
      if(fresh.length){const b=fb.writeBatch(db);fresh.forEach(d=>b.set(fb.doc(col("businesses")),d));await b.commit()}
      bust();m.close();toast(fresh.length+" added"+(out.length>fresh.length?", "+(out.length-fresh.length)+" skipped (already there)":""));route(true);
    }catch(x){er.textContent=friendly(x);btn.disabled=false;btn.textContent="Add all"}
  };
}

function referral(b){
  const m=modal(`<h2>Refer a customer to<br>${esc(b.name)}</h2>
   <div class="money" style="margin:8px 0"><small>You earn</small><b style="font-size:1.35rem">${esc(earnText(b))}</b></div>
   <label>Customer's name</label><input id="rn" maxlength="60" placeholder="Who are you referring?">
   <label>Customer's phone <small>(optional)</small></label><input id="rp" type="tel" inputmode="numeric" maxlength="10">
   <label class="check" style="margin-top:14px"><input type="checkbox" id="rcb"><span>My customer agrees to share their name with this business.</span></label>
   <p class="err" id="re"></p>
   <button class="btn g big" id="rg">Get my referral code</button>`);
  $("#rg",m).onclick=async()=>{
    const n=$("#rn",m).value.trim(),ph=$("#rp",m).value.trim(),er=$("#re",m);
    if(n.length<2)return er.textContent="Please write the customer's name.";
    if(ph&&!/^\d{10}$/.test(ph))return er.textContent="Phone must be 10 digits, or leave it empty.";
    if(!$("#rcb",m).checked)return er.textContent="Please tick the box. The customer must agree.";
    const btn=$("#rg",m);btn.disabled=true;btn.textContent="Please wait…";
    const code=mkCode(U.uid,b.id);
    try{
      await fb.addDoc(col("referrals"),{bizId:b.id,bizName:b.name,bizPhone:b.phone,workerUid:U.uid,workerName:P.name,workerPhone:P.phone,customer:n,cphone:ph,code,status:"sent",t:Date.now()});
    }catch(x){er.textContent=friendly(x);btn.disabled=false;btn.textContent="Get my referral code";return}
    m.querySelector(".m").innerHTML=`<button class="x">×</button><h2>✅ Done!</h2><p>Tell <b>${esc(b.name)}</b> this code. It proves <b>you</b> sent ${esc(n)}.</p><div class="code">${esc(code)}</div>
      <a class="btn g big" target="_blank" rel="noopener" href="${wa(b.phone,"Hi, I referred "+n+" to you. My BusinessConnect code is "+code+".")}">💬 Send code on WhatsApp</a>
      <a class="btn o big" style="margin-top:10px" href="#/refs" id="seeR">See my referrals</a>`;
    $("#seeR",m).onclick=()=>m.close();
  };
}

(async()=>{
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [a,au,fs]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
    const fapp=a.initializeApp(firebaseConfig);
    auth=au.getAuth(fapp);auth.languageCode="en";db=fs.getFirestore(fapp);fb={...au,...fs};
  }catch(e){
    console.error(e);
    app.innerHTML=`<div class="empty"><b>⚠️ Could not connect</b><p class="muted small">Please check your internet and open the page again.</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  fb.onAuthStateChanged(auth,async user=>{
    U=user;P=null;ADMIN=false;SAVED=new Set();
    if(user){
      try{const s=await fb.getDoc(dref("users",user.uid));P=s.exists()?s.data():null}catch(e){console.error(e)}
      if(P)await loadExtras();
    }
    READY=true;
    if(user&&P&&location.hash.startsWith("#/login")){const n=NEXT||"#/";NEXT=null;location.hash=n;return}
    route();
  });
})();
