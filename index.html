<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BusinessConnect – Refer customers. Earn commission.</title>
<style>
:root{--blue:#1565c0;--blue-d:#0d47a1;--blue-l:#e3f0ff;--green:#1b9e5a;--green-d:#13794a;--green-l:#e4f7ec;--ink:#16222e;--muted:#5f6f7f;--line:#e3e9ef;--bg:#f4f7fb;--card:#fff;--soft:#eef3f8;--warn:#9a5b00;--warn-l:#fff4e0;--red:#c62828;--shadow:0 4px 16px rgba(20,60,100,.08);color-scheme:light}
[data-theme=dark]{--blue:#5aa5f7;--blue-d:#3b8ae0;--blue-l:#17304f;--green:#2fc57a;--green-d:#47d98f;--green-l:#133a2a;--ink:#e8eef5;--muted:#9fb0c1;--line:#26364a;--bg:#0d1621;--card:#152130;--soft:#1b2a3a;--warn:#f0b04a;--warn-l:#3a2d12;--red:#ff7b7b;--shadow:0 4px 16px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--blue);text-decoration:none}
h1{font-size:1.6rem;line-height:1.2;margin:.3em 0}
h2{font-size:1.25rem;margin:0 0 .5em}
h3{font-size:1.08rem;margin:0}
p{margin:.4em 0}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:8px;height:56px}
.logo{font-weight:800;font-size:1.3rem;color:var(--blue);margin-right:auto}.logo b{color:var(--green)}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:var(--soft);font-size:1.15rem;cursor:pointer;color:var(--ink)}
#sp{display:none;padding:0 0 10px}#sp.on{display:block}
.demo{background:var(--ink);color:var(--bg);text-align:center;font-size:.78rem;padding:5px 10px}

/* inputs & buttons */
input,select,textarea{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
label{display:block;font-weight:700;font-size:.95rem;margin:14px 0 5px}
label small{font-weight:400;color:var(--muted)}
.btn{display:inline-block;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer;text-align:center}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--green)}.btn.o{background:transparent;color:var(--blue);border:2px solid var(--blue)}.btn.r{background:var(--red)}
.btn.s{padding:9px 14px;font-size:.92rem}.btn.big{display:block;width:100%;font-size:1.1rem;padding:16px}
.btn[disabled]{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:16px}
.chip{display:inline-block;background:var(--blue-l);color:var(--blue);font-weight:700;font-size:.8rem;padding:4px 11px;border-radius:99px}
.chip.g{background:var(--green-l);color:var(--green-d)}.chip.w{background:var(--warn-l);color:var(--warn)}
.note{background:var(--warn-l);color:var(--ink);border-left:5px solid var(--warn);border-radius:10px;padding:11px 13px;font-size:.93rem;margin:14px 0}
.err{color:var(--red);font-weight:600;min-height:1.3em;margin:8px 0 0}

/* home */
.hero{background:linear-gradient(135deg,#1565c0,#0f7f8f 55%,#1b9e5a);color:#fff;border-radius:24px;padding:24px 18px;margin:14px 0;text-align:center}
.hero h1{font-size:1.75rem}.hero p{opacity:.95}
.hero .two{display:grid;gap:10px;margin-top:16px}
.hero .btn{font-size:1.05rem;padding:16px}.hero .w{background:#fff;color:var(--blue-d)}.hero .t{background:rgba(255,255,255,.16);border:2px solid #fff}
.steps{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:9px 15px;color:var(--ink);font-weight:600;font-size:.95rem;white-space:nowrap}
.chips a.on{background:var(--blue);border-color:var(--blue);color:#fff}
.head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.head h2{margin:0}

/* business cards */
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}.hero .two{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.biz{overflow:hidden}
.pic{display:block;height:150px;position:relative;background:var(--soft)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.earn{position:absolute;left:10px;bottom:10px;background:var(--green);color:#fff;font-weight:800;padding:6px 12px;border-radius:99px;font-size:.92rem;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.biz .b{padding:13px 14px 14px}
.biz .sub{color:var(--muted);font-size:.9rem;margin:2px 0 10px}
.btns{display:flex;gap:8px;align-items:center}
.btns .btn{flex:1;padding:11px 6px;font-size:.95rem}
.heart{flex:none;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer;color:var(--red)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}.empty b{display:block;font-size:1.1rem;color:var(--ink)}

/* detail */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory}.gal img{height:210px;border-radius:16px;scroll-snap-align:start;max-width:88vw;object-fit:cover}
.money{background:var(--green-l);border:2px solid var(--green);border-radius:18px;padding:16px;text-align:center;margin:14px 0}
.money small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.money b{display:block;font-size:1.7rem;color:var(--green-d)}
.rowbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

/* referrals */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin:12px 0}
.seg a{text-align:center;padding:11px 6px;border-radius:11px;font-weight:700;color:var(--muted)}.seg a.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.prog{display:flex;gap:4px;margin:10px 0 4px}.prog i{flex:1;height:8px;border-radius:5px;background:var(--line)}.prog i.on{background:var(--green)}
.proglab{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);font-weight:600}
.rc{padding:14px;margin-bottom:12px}

/* account */
.list a,.list button{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.list a:last-child,.list button:last-child{border-bottom:0}
.list .ic{font-size:1.4rem;width:34px;text-align:center}.list .go{margin-left:auto;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px}.stat b{display:block;font-size:1.5rem;color:var(--blue)}.stat span{font-size:.78rem;color:var(--muted)}

/* tab bar */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60;box-shadow:0 -4px 16px rgba(20,60,100,.08)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;color:var(--muted);font-size:.69rem;font-weight:700;white-space:nowrap}
nav a i{font-style:normal;font-size:1.45rem;line-height:1.1}nav a.on{color:var(--blue)}
@media(min-width:900px){body{padding-bottom:20px}}

/* modal + toast */
.mw{position:fixed;inset:0;background:rgba(8,20,32,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.m{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));position:relative}
@media(min-width:640px){.mw{align-items:center}.m{border-radius:24px}}
.x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:2rem;color:var(--muted);cursor:pointer}
#toast{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:200;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.25s;font-weight:600;max-width:90vw}
#toast.on span{opacity:1;transform:none}
.code{font-size:1.7rem;font-weight:800;letter-spacing:2px;text-align:center;background:var(--green-l);color:var(--green-d);border-radius:14px;padding:12px;margin:10px 0}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.95rem}.check input{width:22px;height:22px;flex:none;margin-top:2px}
.pre{flex:none;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:13px;font-weight:700}
.spin{width:36px;height:36px;border:4px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;margin:40px auto 10px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* compact business card */
.biz{display:block}
.biz .top{display:flex;gap:12px;padding:12px 12px 0;align-items:center}
.biz .pic{flex:none;width:76px;height:76px;border-radius:14px;overflow:hidden;background:var(--soft)}
.biz .pic img{width:100%;height:100%;object-fit:cover}
.biz .inf{min-width:0;flex:1}
.biz .inf h3{font-size:1.05rem;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.biz .inf .sub{margin:0 0 6px;font-size:.84rem;line-height:1.35}
.biz .earn2{display:inline-block;background:var(--green-l);color:var(--green-d);font-weight:800;font-size:.82rem;padding:3px 10px;border-radius:99px;border:1px solid var(--green)}
.biz .btns{padding:12px}
.biz .btns .btn{padding:10px 14px;font-size:.95rem}

/* home like directory apps */
.hsearch{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;margin:14px 0 4px;box-shadow:var(--shadow)}
.hsearch input{border:0;padding:10px 4px;background:transparent;box-shadow:none}
.hsearch input:focus{box-shadow:none}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin:18px 0 8px}
.ct{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);text-align:center}
.ct .ci{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:color-mix(in srgb,hsl(var(--h) 85% 55%) 17%,var(--card))}
.ct .cn{font-size:.8rem;font-weight:600;line-height:1.2}
.cgrid .more{display:none}.cgrid.all .more{display:flex}
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--blue-l);border-radius:18px;padding:16px;margin:16px 0}
.promo h2{font-size:1.15rem;margin:0 0 2px;color:var(--ink)}
.promo .pb{display:flex;gap:8px}
.center{text-align:center}

/* clean look: one accent colour */
:root{--green:#1565c0;--green-d:#0d47a1;--green-l:#e8f0fb}
[data-theme=dark]{--green:#5aa5f7;--green-d:#8fc0fa;--green-l:#17304f}
.logo{color:var(--ink)}.logo b{color:var(--blue)}
.ct .ci{background:var(--soft)}
.promo{background:var(--soft)}
.btn.g{color:#fff}[data-theme=dark] .btn,[data-theme=dark] .btn.g{color:#0d1621}[data-theme=dark] .btn.o{color:var(--blue)}
.biz .earn2{background:transparent;border:0;padding:0;color:var(--ink);font-weight:700}
.nwl{display:flex;flex-direction:column}
.nw{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.nw b{display:block;font-size:.98rem;line-height:1.35;font-weight:600}
.nw span{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
.svc{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border:0}
</style><style>[hidden]{display:none!important}.btn.gbtn{background:#fff;color:#222;border:1.5px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px}.btn.gbtn:hover{background:#f6f8fb}</style>
</head>

  <div class="bar">

<script type="module">
// ============ Firebase settings (these are public web settings, safe to keep here) ============
const FB_VERSION = "13.3.0";
const firebaseConfig = {
  apiKey: "AIzaSyCW30hxDg5IOjg3TUFyC2iIU6h5aSvXjKA",
  authDomain: "business-reference-edcf3.firebaseapp.com",
  projectId: "business-reference-edcf3",
  storageBucket: "business-reference-edcf3.firebasestorage.app",
  messagingSenderId: "610068375850",

};

// ============ small helpers ============
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS={"Real Estate":"🏠","Electronics":"🔌","Mobile Phones":"📱","Clothing and Fashion":"👗","Grocery":"🛒","Restaurants and Hotels":"🍽️","Automobile":"🚗","Education":"🎓","Coaching Classes":"📚","Travel and Tourism":"✈️","Beauty and Salon":"💇","Healthcare Services":"🏥","Construction":"🏗️","Interior Design":"🛋️","Furniture":"🪑","Digital Marketing":"📣","Web Development":"💻","Insurance":"🛡️","Financial Services":"💰","Event Management":"🎉","Wholesale and Retail":"📦","Other Services":"🧰"};

const catName=c=>SHORT[c]||c;
const art=(e,a,b)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='400' height='300' fill='url(#g)'/><text x='200' y='195' font-size='120' text-anchor='middle'>${e}</text></svg>`);
const imgOf=b=>b.img||art(CATS[b.cat]||"🏪","#eef3f8","#dbe6f2");
const toast=m=>{const t=$("#toast");t.firstElementChild.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),3000)};
const earnText=b=>b.ct==="percent"?`${b.cv}% commission`:b.ct==="fixed"?`₹${Number(b.cv).toLocaleString("en-IN")} per customer`:"Talk to owner";
const earnShort=b=>b.ct==="percent"?`${b.cv}%`:b.ct==="fixed"?`₹${Number(b.cv).toLocaleString("en-IN")}`:"Negotiable";
const wa=(p,t="")=>`https://wa.me/91${p}${t?"?text="+encodeURIComponent(t):""}`;
const fmtD=d=>new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const spin=()=>`<div class="spin"></div>`;
const tagsOf=b=>String(b.tags||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,8);
const svcOf=b=>String(b.svc||"").split("\n").map(x=>x.trim()).filter(Boolean).slice(0,12).map(l=>{const m=l.match(/^(.*\S)\s+[-–—]\s+(.+)$/);return m?[m[1],m[2]]:[l,""]});
const imgsOf=b=>(b.imgs&&b.imgs.length)?b.imgs:[imgOf(b)];
const ago=d=>{const t=new Date(String(d).replace(" ","T")+(/Z|\+/.test(d)?"":"Z")).getTime();if(!t)return"";const m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const NEWSF={biz:"https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-IN&gl=IN&ceid=IN:en",msme:"https://news.google.com/rss/search?q=MSME+OR+%22small+business%22+India+when:7d&hl=en-IN&gl=IN&ceid=IN:en"};
async function getNews(k){
  const key="bcnews_"+k;
  try{const c=JSON.parse(sessionStorage.getItem(key)||"null");if(c&&Date.now()-c.t<18e5)return c.items}catch{}
  const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(NEWSF[k]));const j=await r.json();
  if(j.status!=="ok")throw new Error("news");
  const items=j.items.slice(0,20).map(i=>{const m=i.title.match(/^(.*) - ([^-]+)$/);return{t:m?m[1]:i.title,s:m?m[2]:"",u:i.link,d:i.pubDate}});
  try{sessionStorage.setItem(key,JSON.stringify({t:Date.now(),items}))}catch{}
  return items;
}
const newsHtml=(l,n)=>l.slice(0,n).map(x=>`<a class="nw" href="${esc(x.u)}" target="_blank" rel="noopener"><b>${esc(x.t)}</b><span>${esc(x.s)}${x.s?" · ":""}${esc(ago(x.d))}</span></a>`).join("");
const lastOrder=(a,b)=>(b.t||0)-(a.t||0);

// one code per worker + business pair (always the same for the same pair)
function mkCode(a,b){let h1=0xdeadbeef,h2=0x41c6ce57;const s=a+"|"+b;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  let n=4294967296*(2097151&h2)+(h1>>>0);const C="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let o="";for(let i=0;i<7;i++){o+=C[n%32];n=Math.floor(n/32)}return "BC-"+o}

function friendly(e){
  const c=(e&&e.code)||"";
  if(c.includes("invalid-phone-number"))return "This mobile number is not correct.";
  if(c.includes("too-many-requests"))return "Too many tries. Please wait a few minutes.";
  if(c.includes("invalid-verification-code"))return "Wrong code. Please check and try again.";
  if(c.includes("code-expired"))return "This code has expired. Please ask for a new one.";
  if(c.includes("operation-not-allowed"))return "Google login is not switched on yet. Firebase → Authentication → Sign-in method → Google → Enable.";
  if(c.includes("popup-blocked"))return "Your browser blocked the login window. Please allow pop-ups for this site and try again.";
  if(c.includes("already been rendered"))return "Please try again.";
  if(c.includes("unauthorized-domain")||c.includes("captcha"))return "This website address is not allowed yet. Add it in Firebase → Authentication → Settings → Authorized domains.";
  if(c.includes("permission-denied"))return "You are not allowed to do this. Please login again.";
  if(c.includes("network"))return "No internet. Please try again.";
  return (e&&e.message)||"Something went wrong. Please try again.";
}
function shrink(file){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=no;fr.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.65))};im.src=fr.result};fr.readAsDataURL(file)})}
function modal(html){const w=document.createElement("div");w.className="mw";w.innerHTML=`<div class="m"><button class="x" aria-label="Close">×</button>${html}</div>`;document.body.appendChild(w);w.close=()=>w.remove();w.onclick=e=>{if(e.target===w||e.target.classList.contains("x"))w.close()};return w}

async function approved(){

const app=$("#app");
const GATED=new Set(["shop","edit","refs","me","saved","admin"]);
let tok=0;
async function route(keep){
  if(!READY){app.innerHTML=spin();return}
  const my=++tok;
  const parts=location.hash.replace(/^#\/?/,"").split("?"),segs=parts[0].split("/").filter(Boolean);
  const name=segs[0]||"home",id=segs[1],q=new URLSearchParams(parts[1]||"");
  const t=({home:"home",list:"list",biz:"list",refs:"refs",shop:"shop",edit:"shop"})[name]||(["me","saved","help","admin","login"].includes(name)?"me":"home");
  $$("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===t));
  $("#lg").hidden=!!U;
  const show=h=>{if(my!==tok)return false;app.innerHTML=h;if(!keep)window.scrollTo(0,0);return true};
  if(name==="login"){
    if(U&&P){const n=NEXT||"#/";NEXT=null;location.hash=n;return}
    if(!U){show(loginPage());bindLogin();return}
  }
  if(U&&!P){show(setupPage());bindSetup();return}
  if(GATED.has(name)&&!U){show(loginPage("Please login to use this. It only takes a minute."));bindLogin();return}
  if(!pages[name]){show(`<div class="empty"><b>Page not found</b><a class="btn" href="#/">Go home</a></div>`);return}
  if(!keep)app.innerHTML=spin();
  try{const html=await pages[name](q,id);if(show(html))bind(name)}
  catch(e){console.error(e);show(`<div class="empty"><b>⚠️ Could not load</b><p class="muted small">${esc(friendly(e))}</p><button class="btn" id="retry">Try again</button></div>`);const r=$("#retry");if(r)r.onclick=()=>route()}
}

function bindEdit(form){
  const sync=()=>{const t=$("#ct").value;$("#cvw").hidden=t==="talk";$("#cvl").textContent=t==="percent"?"Percent (%) – example: 10":"Amount in ₹ – example: 500"};
  $("#ct").onchange=sync;sync();
  form.onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(form),g=k=>String(f.get(k)||"").trim(),err=$("#ee"),fail=m=>{err.textContent=m;err.scrollIntoView({block:"center",behavior:"smooth"})};
    if(!g("name"))return fail("Please write your business name.");
    if(!g("cat"))return fail("Please choose what you sell.");
    if(!g("owner"))return fail("Please write your name.");
    if(!/^[6-9]\d{9}$/.test(g("phone")))return fail("Please write a correct 10-digit mobile number.");
    if(!g("city")||!g("area"))return fail("Please write your city and area.");
    const ct=g("ct"),cv=+g("cv");
    if(ct!=="talk"&&!(cv>0))return fail("Please write the commission amount.");
    if(ct==="percent"&&cv>100)return fail("Percent cannot be more than 100.");
    if(!f.get("ok"))return fail("Please tick the box to agree.");
    const btn=form.querySelector(".big");btn.disabled=true;btn.textContent="Saving…";
    try{
      const data={name:g("name"),cat:g("cat"),owner:g("owner"),phone:g("phone"),city:g("city"),area:g("area"),ct,cv:ct==="talk"?0:cv,note:g("note"),desc:g("desc"),tags:g("tags"),svc:g("svc")};
      const files=f.getAll("photo").filter(x=>x&&x.size).slice(0,4);
      if(files.length){data.imgs=await Promise.all(files.map(shrink));data.img=data.imgs[0]}else if(f.get("rmph")){data.imgs=[];data.img=""}
      const ex=await getBiz(U.uid);
      if(ex)await fb.updateDoc(dref("businesses",U.uid),{...data,upd:Date.now()});
      else await fb.setDoc(dref("businesses",U.uid),{img:"",...data,ownerUid:U.uid,status:"pending",featured:false,t:Date.now()});
      bust();toast(ex?"Saved":"Sent for approval!");location.hash="#/shop";
    }catch(x){console.error(x);fail(friendly(x));btn.disabled=false;btn.textContent="Save"}
  };
}

function needLogin(msg){NEXT=location.hash;toast(msg||"Please login first");location.hash="#/login"}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const m=$$(".mw");if(m.length)m[m.length-1].remove()}});
document.addEventListener("click",async e=>{
  const s=e.target.closest("[data-save]");
  if(s){
    if(!U)return needLogin("Please login to save");
    const id=s.dataset.save,has=SAVED.has(id);
    try{
      has?await fb.deleteDoc(dref("users",U.uid,"saved",id)):await fb.setDoc(dref("users",U.uid,"saved",id),{t:Date.now()});
      has?SAVED.delete(id):SAVED.add(id);
      s.textContent=s.classList.contains("heart")?(has?"♡":"♥"):(has?"♡ Save":"♥ Saved");toast(has?"Removed":"Saved");
      if(location.hash.startsWith("#/saved"))route(true);
    }catch(x){toast(friendly(x))}
    return;
  }
  const r=e.target.closest("[data-refer]");
  if(r){if(!U)return needLogin("Please login to refer a customer");const b=await getBiz(r.dataset.refer);if(b)referral(b);return}
  const st=e.target.closest("[data-st]");
  if(st){const [id,v]=st.dataset.st.split("|");st.disabled=true;try{await fb.updateDoc(dref("referrals",id),{status:v,t2:Date.now()});toast("Updated");route(true)}catch(x){toast(friendly(x));st.disabled=false}return}
  const rp=e.target.closest("[data-report]");
  if(rp){if(!U)return needLogin("Please login to report");const b=await getBiz(rp.dataset.report),why=prompt("What is wrong with this business?");
    if(why&&why.trim()){try{await fb.addDoc(col("reports"),{bizId:b.id,name:b.name,why:why.trim().slice(0,400),by:U.uid,t:Date.now()});toast("Thank you. The admin will check.")}catch(x){toast(friendly(x))}}return}
  const ad=e.target.closest("[data-ad]");
  if(ad){const [a,id]=ad.dataset.ad.split("|");
    if(a==="add")return adminAdd();
    if(a==="bulk")return adminBulk();
    if(a==="edit"){const eb=await getBiz(id);return eb&&adminAdd(eb)}
    try{
      if(a==="rep")await fb.deleteDoc(dref("reports",id));
      if(a==="ok")await fb.updateDoc(dref("businesses",id),{status:"approved"});
      if(a==="star"){const b=await getBiz(id);await fb.updateDoc(dref("businesses",id),{featured:!b.featured})}
      if(a==="del"){if(!confirm("Remove this business?"))return;await fb.deleteDoc(dref("businesses",id))}
      bust();toast("Done");route(true);
    }catch(x){toast(friendly(x))}
  }
});

function adminBulk(){
  const cats=Object.keys(CATS);
  const m=modal(`<h2>Add many businesses</h2>
   <p class="muted small">One business per line. Separate with commas:<br><b>name, category, owner, mobile, city, area, commission</b></p>
   <p class="small" style="background:var(--soft);padding:8px;border-radius:10px">Example:<br>Sharma Sweets, Grocery, Raj Sharma, 9876543210, Pune, Pimpri, 10%<br>City Mobiles, Mobile Phones, Amit, 9123456780, Pune, Akurdi, 300<br>Raj Tutors, Education, Raj, 9012345678, Pune, Nigdi, talk</p>
   <p class="muted small">Commission: <b>10%</b> = percent, <b>300</b> = fixed ₹, <b>talk</b> = talk to owner. Wrong category becomes "Other Services".</p>
   <textarea id="bt" rows="8" placeholder="Paste your lines here"></textarea>
   <p class="err" id="be"></p><button class="btn g big" id="bg">Add all</button>`);
  $("#bg",m).onclick=async()=>{
    const er=$("#be",m),lines=$("#bt",m).value.split("\n").map(x=>x.trim()).filter(Boolean),out=[],bad=[];
    lines.forEach((ln,i)=>{
      const p=ln.split(",").map(x=>x.trim());
      if(p.length<7){bad.push(i+1);return}
      const [name,cat,owner,phone,city,area,com]=p,ph=phone.replace(/\D/g,"").slice(-10);
      let ct="talk",cv=0;
      if(/%$/.test(com)){ct="percent";cv=parseFloat(com)}else if(/^\d+(\.\d+)?$/.test(com)){ct="fixed";cv=parseFloat(com)}
      if(!name||!owner||!city||!area||!/^[6-9]\d{9}$/.test(ph)||(ct!=="talk"&&!(cv>0))||(ct==="percent"&&cv>100)){bad.push(i+1);return}
      const c=cats.find(k=>k.toLowerCase()===cat.toLowerCase())||"Other Services";
      out.push({name:name.slice(0,70),cat:c,owner:owner.slice(0,60),phone:ph,city:city.slice(0,40),area:area.slice(0,50),ct,cv,note:"",desc:"",img:"",ownerUid:"",status:"approved",featured:false,addedBy:U.uid,t:Date.now()});
    });
    if(!lines.length)return er.textContent="Please paste at least one line.";
    if(bad.length)return er.textContent="Please check line number: "+bad.join(", ")+". Nothing was added.";
    if(out.length>200)return er.textContent="Please add up to 200 at a time.";
    const btn=$("#bg",m);btn.disabled=true;btn.textContent="Adding…";
    try{
      const have=new Set(rows(await fb.getDocs(col("businesses"))).map(x=>x.phone+"|"+String(x.name).toLowerCase()));
      const fresh=out.filter(d=>{const k=d.phone+"|"+d.name.toLowerCase();if(have.has(k))return false;have.add(k);return true});
      if(fresh.length){const b=fb.writeBatch(db);fresh.forEach(d=>b.set(fb.doc(col("businesses")),d));await b.commit()}
      bust();m.close();toast(fresh.length+" added"+(out.length>fresh.length?", "+(out.length-fresh.length)+" skipped (already there)":""));route(true);
    }catch(x){er.textContent=friendly(x);btn.disabled=false;btn.textContent="Add all"}
  };
}

  const X=ex||{},ev=k=>esc(X[k]??"");
  const m=modal(`<h2>${ex?"Edit business":"Add a business"}</h2>${ex?"":`<p class="muted small">It goes live at once. The shop owner is not linked, so you manage it from Admin.</p>`}

    const btn=$("#ag",m);btn.disabled=true;

      const dup=rows(await fb.getDocs(col("businesses"))).some(x=>x.phone===v("#ap")&&String(x.name).toLowerCase()===v("#an").toLowerCase());
      if(dup){er.textContent="This business is already added.";btn.disabled=false;return}
      await fb.addDoc(col("businesses"),{note:"",img:"",...base,ownerUid:"",status:"approved",featured:false,addedBy:U.uid,t:Date.now()});
      bust();m.close();toast("Business added");route(true);

}

// ============ header buttons & theme ============
$("#sb").onclick=()=>{$("#sp").classList.toggle("on");if($("#sp").classList.contains("on"))$("#sq").focus()};
$("#sp").onsubmit=e=>{e.preventDefault();const v=$("#sq").value.trim();$("#sp").classList.remove("on");location.hash="#/list"+(v?"?q="+encodeURIComponent(v):"")};
let theme="light";try{theme=localStorage.getItem("bc_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch{}
const setTheme=t=>{document.documentElement.dataset.theme=t;$("#tb").textContent=t==="dark"?"☀️":"🌙";$('meta[name=theme-color]').content=t==="dark"?"#0d1621":"#1565c0"};
setTheme(theme);
$("#tb").onclick=()=>{theme=theme==="dark"?"light":"dark";try{localStorage.setItem("bc_theme",theme)}catch{}setTheme(theme)};

// ============ start ============
(async()=>{
  try{
    const base=`https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [a,au,fs]=await Promise.all([import(base+"firebase-app.js"),import(base+"firebase-auth.js"),import(base+"firebase-firestore.js")]);
    const fapp=a.initializeApp(firebaseConfig);
    auth=au.getAuth(fapp);auth.languageCode="en";db=fs.getFirestore(fapp);fb={...au,...fs};
  }catch(e){
    console.error(e);
    app.innerHTML=`<div class="empty"><b>⚠️ Could not connect</b><p class="muted small">Please check your internet and open the page again.</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  fb.onAuthStateChanged(auth,async user=>{
    U=user;P=null;ADMIN=false;SAVED=new Set();
    if(user){
      try{const s=await fb.getDoc(dref("users",user.uid));P=s.exists()?s.data():null}catch(e){console.error(e)}
      if(P)await loadExtras();
    }
    READY=true;
    if(user&&P&&location.hash.startsWith("#/login")){const n=NEXT||"#/";NEXT=null;location.hash=n;return}
    route();
  });
})();

// ---- install as app ----
let DIP=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DIP=e;$("#ins").hidden=false});
window.addEventListener("appinstalled",()=>{DIP=null;$("#ins").hidden=true;toast("App installed")});
$("#ins").onclick=async()=>{if(!DIP)return;DIP.prompt();try{await DIP.userChoice}catch{}DIP=null;$("#ins").hidden=true};
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
